## Project
name: tasty_bytes
version: "1.0"
config-version: 2
profile: tasty_bytes

## Sources
model-paths: [models]
analysis-paths: [analysis]
test-paths: [tests]
seed-paths: [seeds]
macro-paths: [macros]
snapshot-paths: [snapshots]

## Target
target-path: target
clean-targets: [target, dbt_modules]

## Models
# models:
#   tasty_bytes:
#     staging:
#       +schema: bronze
#       +materialized: view
#     intermediate:
#       +schema: silver
#       +materialized: view
#     marts:
#       +schema: gold
#       +materialized: table

models:
  tasty_bytes:
    staging:
      +materialized: view
      +schema: bronze
      +tags: ["staging", "bronze"]

    intermediate:
      +materialized: view
      conformed:
        +schema: silver_prep
        +tags: ["intermediate", "prepare_conformed", "silver_prep"]
      marts:
        +schema: gold_prep
        +tags: ["intermediate", "prepare_marts", "gold_prep"]

    conformed:
      +materialized: table
      +schema: silver
      +tags: ["conformed", "silver"]

    marts:
      +materialized: table
      +schema: gold
      +tags: ["marts", "gold"]

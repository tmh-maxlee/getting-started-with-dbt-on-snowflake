# Snowflake resolves these SQL expressions before starting dbt.
# Each developer must use their own Snowflake user.
env_config:
  default_environment: dev
  environments:
    - name: dev
      env:
        # Sanitize email-style usernames; a hash distinguishes sanitized collisions.
        DBT_DEV_SCHEMA: "{{ select 'DBT_' || LEFT(REGEXP_REPLACE(UPPER(CURRENT_USER()), '[^A-Z0-9_]', '_'), 100) || '_' || UPPER(LEFT(MD5(CURRENT_USER()), 8)) }}"
        DBT_DEV_ROLE: "{{ select CURRENT_ROLE() }}"

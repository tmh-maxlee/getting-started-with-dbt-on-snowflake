# Snowflake resolves these SQL expressions before starting dbt.
# Each developer must use their own Snowflake user.
env_config:
  default_environment: dev
  environments:
    - name: dev
      env:
        # Use DEV_<username>, replacing punctuation for email-style usernames.
        # Leave room for layer suffixes such as _BRONZE within the identifier limit.
        DBT_DEV_SCHEMA: "{{ select 'DEV_' || LEFT(REGEXP_REPLACE(UPPER(CURRENT_USER()), '[^A-Z0-9_]', '_'), 244) }}"
        DBT_DEV_ROLE: "{{ select CURRENT_ROLE() }}"
    - name: prod
      env:
        DBT_PROD_DATABASE: TASTY_BYTES_DBT_DB
        DBT_PROD_SCHEMA: PROD
        DBT_PROD_ROLE: "{{ select CURRENT_ROLE() }}"
        DBT_PROD_WAREHOUSE: TASTY_BYTES_DBT_WH
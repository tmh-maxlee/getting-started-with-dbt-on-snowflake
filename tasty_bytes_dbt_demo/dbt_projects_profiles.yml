tasty_bytes:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: 'not needed'
      user: 'not needed'
      role: "{{ env_var('DBT_DEV_ROLE') }}"
      database: dev
      schema: "{{ env_var('DBT_DEV_SCHEMA') }}"
      warehouse: tasty_bytes_dbt_wh
      threads: 8
    prod:
      type: snowflake
      account: 'not needed'
      user: 'not needed'
      role: "{{ env_var('DBT_PROD_ROLE') }}"
      database: "{{ env_var('DBT_PROD_DATABASE') }}"
      schema: gold
      warehouse: "{{ env_var('DBT_PROD_WAREHOUSE') }}"
      threads: 8
